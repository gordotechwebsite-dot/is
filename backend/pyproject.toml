[project]
name = "isphone-backend"
version = "1.0.0"
description = "iSphone Admin API"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "sqlalchemy==2.0.36",
    "python-multipart==0.0.19",
    "aiofiles==24.1.0",
    "pydantic==2.10.4",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
